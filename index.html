<script>
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem("gl_" + key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem("gl_" + key, value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem("gl_" + key);
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async list(prefix, shared) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("gl_" + (prefix || ""))) keys.push(k.slice(3));
        }
        return { keys, prefix, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
  };
</script>

const BLOCK_A_WEEKS = [1, 2, 3, 4, 9, 10];
function effectiveWeek(week) {
  return ((week - 1) % 12) + 1;
}
function daysForWeek(week) {
  return BLOCK_A_WEEKS.includes(effectiveWeek(week)) ? BLOCK_A_DAYS : BLOCK_B_DAYS;
}

function youtubeSearchUrl(name) {
  const q = encodeURIComponent(name.replace(/\(.*?\)/g, "") + " ejercicio tecnica");
  return `https://www.youtube.com/results?search_query=${q}`;
}

function todayLabel() {
  const d = new Date();
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short" });
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

function parseRepsTarget(repsStr) {
  if (!repsStr) return null;
  const matches = String(repsStr).match(/\d+/g);
  if (!matches || matches.length === 0) return null;
  return parseInt(matches[matches.length - 1], 10);
}

function parseSetReps(val) {
  if (val === null || val === undefined || val === "") return null;
  const m = String(val).match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

function parseSetWeight(val) {
  if (val === null || val === undefined || val === "") return null;
  const n = parseFloat(val);
  return isNaN(n) ? null : n;
}

function sessionHitsTarget(session, target) {
  if (!session || !session.sets || session.sets.length === 0 || target === null) return false;
  return session.sets.every((s) => {
    const r = parseSetReps(s.reps);
    const w = parseSetWeight(s.weight);
    return r !== null && r >= target && w !== null && w > 0;
  });
}

function suggestedNextWeight(session) {
  if (!session || !session.sets) return null;
  const weights = session.sets.map((s) => parseSetWeight(s.weight)).filter((w) => w !== null);
  if (weights.length === 0) return null;
  const avg = weights.reduce((a, b) => a + b, 0) / weights.length;
  const increased = avg * 1.0375;
  return Math.round(increased / 2.5) * 2.5;
}

function avgWeight(session) {
  if (!session || !session.sets) return null;
  const weights = session.sets.map((s) => parseSetWeight(s.weight)).filter((w) => w !== null);
  if (weights.length === 0) return null;
  return weights.reduce((a, b) => a + b, 0) / weights.length;
}

function blankSets(count, prefillWeight, prefillReps) {
  return Array.from({ length: count }).map(() => ({
    weight: prefillWeight || "",
    reps: prefillReps || "",
    completed: false,
  }));
}

function PlateDots({ count, filled, color }) {
  return (
    <div style={{ display: "flex", gap: 4 }}>
      {Array.from({ length: count }).map((_, i) => (
        <span
          key={i}
          style={{
            width: 6,
            height: 6,
            borderRadius: 999,
            background: i < filled ? color : "transparent",
            border: `1px solid ${color}`,
            opacity: i < filled ? 1 : 0.5,
          }}
        />
      ))}
    </div>
  );
}

function App() {
  useEffect(() => {
    ensureFonts();
  }, []);

  const [activeWeek, setActiveWeek] = useState(1);
  const [weekCount, setWeekCount] = useState(12);
  const [activeIdx, setActiveIdx] = useState(0);
  const [logs, setLogs] = useState({});
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState("");
  const [timer, setTimer] = useState(null);
  const [weekStatus, setWeekStatus] = useState({});
  const [dayStatus, setDayStatus] = useState({});
  const intervalRef = useRef(null);

  const weeksList = Array.from({ length: weekCount }, (_, i) => i + 1);
  const days = daysForWeek(activeWeek);
  const day = days[activeIdx];
  const storageKey = `logs-week${activeWeek}-${day.id}`;
  const dayStatusKey = `week${activeWeek}-${day.id}`;
  const isDeloadWeek = effectiveWeek(activeWeek) === 4;

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("week-status", false);
        setWeekStatus(res && res.value ? JSON.parse(res.value) : {});
      } catch (e) {
        setWeekStatus({});
      }
      try {
        const res2 = await window.storage.get("week-count", false);
        if (res2 && res2.value) setWeekCount(Math.max(12, parseInt(res2.value, 10) || 12));
      } catch (e) {
        // keep default
      }
      try {
        const res3 = await window.storage.get("day-status", false);
        setDayStatus(res3 && res3.value ? JSON.parse(res3.value) : {});
      } catch (e) {
        setDayStatus({});
      }
    })();
  }, []);

  const addMoreWeeks = async () => {
    const next = weekCount + 12;
    setWeekCount(next);
    try {
      await window.storage.set("week-count", String(next), false);
    } catch (e) {
      setSaveError("No se pudo guardar. Intenta de nuevo.");
    }
  };

  const toggleWeekComplete = async (week) => {
    const next = { ...weekStatus, [week]: !weekStatus[week] };
    setWeekStatus(next);
    try {
      await window.storage.set("week-status", JSON.stringify(next), false);
    } catch (e) {
      setSaveError("No se pudo guardar. Intenta de nuevo.");
    }
  };

  const toggleDayComplete = async (key) => {
    const next = { ...dayStatus, [key]: !dayStatus[key] };
    setDayStatus(next);
    try {
      await window.storage.set("day-status", JSON.stringify(next), false);
    } catch (e) {
      setSaveError("No se pudo guardar. Intenta de nuevo.");
    }
  };

  const loadDay = useCallback(async (key, exercises, deload) => {
    setLoading(true);
    let parsed = {};
    try {
      const res = await window.storage.get(key, false);
      parsed = res && res.value ? JSON.parse(res.value) : {};
    } catch (e) {
      parsed = {};
    }
    const next = { ...parsed };
    exercises.forEach((ex) => {
      const targetSetCount = deload ? Math.max(1, Math.ceil(ex.sets / 2)) : ex.sets;
      if (!next[ex.id] || !next[ex.id].current || next[ex.id].current.length !== targetSetCount) {
        const lastHist = next[ex.id]?.history?.[0];
        const lastWeight = lastHist?.sets?.[0]?.weight || "";
        let prefillWeight = lastWeight;
        if (deload && lastWeight) {
          const w = parseSetWeight(lastWeight);
          if (w !== null) {
            prefillWeight = String(Math.round((w * 0.75) / 2.5) * 2.5);
          }
        }
        next[ex.id] = {
          history: next[ex.id]?.history || [],
          current: blankSets(targetSetCount, prefillWeight, lastHist?.sets?.[0]?.reps || ""),
        };
      }
    });
    setLogs(next);
    setLoading(false);
  }, []);

  useEffect(() => {
    loadDay(storageKey, day.exercises, isDeloadWeek);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [storageKey, isDeloadWeek]);


  const persist = async (key, data) => {
    try {
      const result = await window.storage.set(key, JSON.stringify(data), false);
      if (!result) setSaveError("No se pudo guardar. Intenta de nuevo.");
      else setSaveError("");
    } catch (e) {
      setSaveError("No se pudo guardar. Intenta de nuevo.");
    }
  };

  const updateCurrent = (exerciseId, nextSets) => {
    const next = {
      ...logs,
      [exerciseId]: { ...logs[exerciseId], current: nextSets },
    };
    setLogs(next);
    persist(storageKey, next);
  };
  updateCurrent.startRest = (exercise, setIdx) => {
    setTimer({
      exerciseId: exercise.id,
      exerciseName: exercise.name,
      setIndex: setIdx,
      secondsLeft: exercise.rest,
      total: exercise.rest,
      running: true,
    });
  };

  const addSet = (exerciseId) => {
    const entry = logs[exerciseId];
    const cur = (entry && entry.current) || [];
    const last = cur[cur.length - 1];
    const nextSets = [
      ...cur,
      { weight: last ? last.weight : "", reps: last ? last.reps : "", completed: false },
    ];
    updateCurrent(exerciseId, nextSets);
  };

  const removeSet = (exerciseId) => {
    const entry = logs[exerciseId];
    const cur = (entry && entry.current) || [];
    if (cur.length <= 1) return;
    updateCurrent(exerciseId, cur.slice(0, -1));
  };

  const saveSession = (exercise) => {
    const entry = logs[exercise.id];
    if (!entry) return;
    const completedSets = entry.current.filter((s) => s.completed);
    if (completedSets.length === 0) return;
    const historyEntry = {
      date: todayLabel(),
      ts: Date.now(),
      sets: entry.current.map((s) => ({ weight: s.weight, reps: s.reps })),
    };
    const next = {
      ...logs,
      [exercise.id]: {
        history: [historyEntry, ...(entry.history || [])],
        current: blankSets(exercise.sets, entry.current[0]?.weight, entry.current[0]?.reps),
      },
    };
    setLogs(next);
    persist(storageKey, next);
  };

  useEffect(() => {
    if (intervalRef.current) clearInterval(intervalRef.current);
    if (timer && timer.running) {
      intervalRef.current = setInterval(() => {
        setTimer((t) => (t ? { ...t, secondsLeft: t.secondsLeft - 1 } : t));
      }, 1000);
    }
    return () => intervalRef.current && clearInterval(intervalRef.current);
  }, [timer && timer.running, timer && timer.exerciseId, timer && timer.setIndex]);

  const adjustTimer = (delta) => {
    setTimer((t) =>
      t ? { ...t, secondsLeft: t.secondsLeft + delta, total: Math.max(t.total, t.secondsLeft + delta) } : t
    );
  };
  const pauseToggle = () => setTimer((t) => (t ? { ...t, running: !t.running } : t));
  const dismissTimer = () => setTimer(null);

  return (
    <div
      style={{
        minHeight: "100vh",
        background: COLORS.bg,
        padding: "20px 14px 100px 14px",
      }}
    >
      <div style={{ maxWidth: 480, margin: "0 auto" }}>
        <header style={{ marginBottom: 22 }}>
          <div
            style={{
              fontFamily: "'Work Sans', sans-serif",
              fontSize: 11,
              letterSpacing: 2,
              textTransform: "uppercase",
              color: COLORS.textMuted,
              marginBottom: 2,
            }}
          >
            Bitacora de entrenamiento
          </div>
          <h1
            style={{
              fontFamily: "'Anton', sans-serif",
              fontSize: 34,
              letterSpacing: 0.5,
              color: COLORS.text,
              margin: 0,
              lineHeight: 1,
            }}
          >
            SEMANA <span style={{ color: COLORS.gold }}>{activeWeek}</span>
          </h1>
        </header>

        <div
          style={{
            display: "flex",
            gap: 6,
            marginBottom: 14,
            overflowX: "auto",
            paddingBottom: 4,
          }}
        >
          {weeksList.map((w) => {
            const isActive = w === activeWeek;
            const isComplete = !!weekStatus[w];
            return (
              <button
                key={w}
                onClick={() => setActiveWeek(w)}
                style={{
                  position: "relative",
                  flex: "0 0 auto",
                  minWidth: 38,
                  height: 38,
                  borderRadius: 10,
                  border: `1px solid ${isActive ? COLORS.gold : isComplete ? COLORS.green : COLORS.line}`,
                  background: isActive ? COLORS.gold : "transparent",
                  color: isActive ? COLORS.bg : isComplete ? COLORS.green : COLORS.textMuted,
                  fontFamily: "'Work Sans', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
                aria-label={`Semana ${w}${isComplete ? " (completada)" : ""}`}
              >
                {isComplete && !isActive ? "✓" : w}
              </button>
            );
          })}
          <button
            onClick={addMoreWeeks}
            style={{
              flex: "0 0 auto",
              minWidth: 38,
              height: 38,
              borderRadius: 10,
              border: `1px dashed ${COLORS.line}`,
              background: "transparent",
              color: COLORS.textMuted,
              fontFamily: "'Work Sans', sans-serif",
              fontWeight: 700,
              fontSize: 15,
              cursor: "pointer",
            }}
            aria-label="Agregar 12 semanas mas"
          >
            +
          </button>
        </div>

        <div
          style={{
            display: "flex",
            gap: 8,
            marginBottom: 18,
            overflowX: "auto",
            paddingBottom: 4,
          }}
        >
          {days.map((d, i) => {
            const accent = d.focus === "priority" ? COLORS.gold : COLORS.teal;
            const isActive = i === activeIdx;
            return (
              <button
                key={d.id}
                onClick={() => setActiveIdx(i)}
                style={{
                  flex: "0 0 auto",
                  width: 56,
                  height: 56,
                  borderRadius: 999,
                  border: `2px solid ${accent}`,
                  background: isActive ? accent : "transparent",
                  color: isActive ? COLORS.bg : accent,
                  fontFamily: "'Anton', sans-serif",
                  fontSize: 20,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  transition: "all 0.15s",
                }}
                aria-label={`Dia ${d.num}: ${d.title}`}
              >
                {d.num}
              </button>
            );
          })}
        </div>

        <div style={{ marginBottom: 16 }}>
          <div
            style={{
              display: "inline-block",
              fontFamily: "'Work Sans', sans-serif",
              fontSize: 11,
              fontWeight: 600,
              letterSpacing: 0.5,
              textTransform: "uppercase",
              color: day.focus === "priority" ? COLORS.gold : COLORS.teal,
              background: day.focus === "priority" ? COLORS.goldDim : COLORS.tealDim,
              padding: "3px 10px",
              borderRadius: 999,
              marginBottom: 8,
            }}
          >
            {day.focus === "priority" ? "Prioridad de crecimiento" : "Mantenimiento"}
          </div>
          <h2
            style={{
              fontFamily: "'Anton', sans-serif",
              fontSize: 26,
              color: COLORS.text,
              margin: 0,
            }}
          >
            {day.title}
          </h2>
        </div>

        {isDeloadWeek && (
          <div
            style={{
              background: "rgba(177,140,255,0.10)",
              border: `1px solid ${COLORS.gold}`,
              borderRadius: 12,
              padding: "12px 14px",
              marginBottom: 16,
            }}
          >
            <div
              style={{
                fontFamily: "'Work Sans', sans-serif",
                fontWeight: 700,
                fontSize: 13,
                color: COLORS.gold,
                marginBottom: 4,
              }}
            >
              🌙 Semana de descarga (deload)
            </div>
            <div
              style={{
                fontFamily: "'Work Sans', sans-serif",
                fontSize: 12.5,
                color: COLORS.text,
                lineHeight: 1.4,
              }}
            >
              Series reducidas a la mitad automaticamente y peso sugerido ~25% mas bajo que tu
              ultima sesion. Entrena dejando 4-5 reps en reserva (no busques el fallo). El
              objetivo esta semana es recuperar, no progresar.
            </div>
          </div>
        )}

        {loading ? (
          <div
            style={{
              color: COLORS.textMuted,
              fontFamily: "'Work Sans', sans-serif",
              fontSize: 13,
              padding: "20px 0",
            }}
          >
            Cargando...
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {day.exercises.map((ex) => (
              <ExerciseCard
                key={ex.id}
                exercise={ex}
                data={logs[ex.id]}
                onUpdateCurrent={updateCurrent}
                onSaveSession={saveSession}
                onAddSet={addSet}
                onRemoveSet={removeSet}
                accent={day.focus === "priority" ? COLORS.gold : COLORS.teal}
                accentDim={day.focus === "priority" ? COLORS.goldDim : COLORS.tealDim}
                upperBody={!!day.upperBody}
              />
            ))}
          </div>
        )}

        {!loading && (() => {
          const accentColor = day.focus === "priority" ? COLORS.gold : COLORS.teal;
          const perExercise = day.exercises.map((ex) => {
            const cur = (logs[ex.id] && logs[ex.id].current) || [];
            return { name: ex.name, done: cur.filter((s) => s.completed).length, total: cur.length };
          });
          const totalDone = perExercise.reduce((sum, e) => sum + e.done, 0);
          const totalPlanned = perExercise.reduce((sum, e) => sum + e.total, 0);
          const isDayComplete = !!dayStatus[dayStatusKey];
          return (
            <div
              style={{
                marginTop: 16,
                background: COLORS.surface,
                border: `1px solid ${isDayComplete ? COLORS.green : COLORS.line}`,
                borderRadius: 14,
                padding: "14px 16px",
              }}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: 10,
                }}
              >
                <span
                  style={{
                    fontFamily: "'Work Sans', sans-serif",
                    fontSize: 11,
                    letterSpacing: 0.5,
                    textTransform: "uppercase",
                    color: COLORS.textMuted,
                  }}
                >
                  Volumen del dia
                </span>
                <span
                  style={{
                    fontFamily: "'Anton', sans-serif",
                    fontSize: 20,
                    color: isDayComplete ? COLORS.green : accentColor,
                  }}
                >
                  {totalDone} / {totalPlanned} series
                </span>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
                {perExercise.map((e, i) => (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      fontFamily: "'Work Sans', sans-serif",
                      fontSize: 12,
                      color: COLORS.textMuted,
                    }}
                  >
                    <span>{e.name}</span>
                    <span style={{ color: e.done === e.total && e.total > 0 ? accentColor : COLORS.textMuted }}>
                      {e.done}/{e.total}
                    </span>
                  </div>
                ))}
              </div>

              <button
                onClick={() => toggleDayComplete(dayStatusKey)}
                style={{
                  width: "100%",
                  background: isDayComplete ? COLORS.green : "transparent",
                  border: `1px solid ${isDayComplete ? COLORS.green : accentColor}`,
                  color: isDayComplete ? COLORS.bg : accentColor,
                  borderRadius: 10,
                  padding: "10px 14px",
                  fontFamily: "'Work Sans', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                  cursor: "pointer",
                }}
              >
                {isDayComplete
                  ? `✓ Dia completado — ${totalDone} series totales — toca para desmarcar`
                  : "Marcar dia como completado"}
              </button>
            </div>
          );
        })()}

        {!loading && day.num === 5 && (
          <button
            onClick={() => toggleWeekComplete(activeWeek)}
            style={{
              width: "100%",
              marginTop: 16,
              background: weekStatus[activeWeek] ? COLORS.green : "transparent",
              border: `1px solid ${weekStatus[activeWeek] ? COLORS.green : COLORS.gold}`,
              color: weekStatus[activeWeek] ? COLORS.bg : COLORS.gold,
              borderRadius: 12,
              padding: "12px 14px",
              fontFamily: "'Work Sans', sans-serif",
              fontWeight: 700,
              fontSize: 14,
              cursor: "pointer",
            }}
          >
            {weekStatus[activeWeek]
              ? `✓ Semana ${activeWeek} completada — toca para desmarcar`
              : `Marcar Semana ${activeWeek} como completada`}
          </button>
        )}

        {saveError && (
          <div
            style={{
              marginTop: 12,
              color: "#D97757",
              fontFamily: "'Work Sans', sans-serif",
              fontSize: 12,
            }}
          >
            {saveError}
          </div>
        )}

        <p
          style={{
            marginTop: 28,
            fontFamily: "'Work Sans', sans-serif",
            fontSize: 11.5,
            color: COLORS.textMuted,
            lineHeight: 1.5,
          }}
        >
          Anota el peso y las reps de cada serie y toca el check al terminarla — el timer de
          descanso arranca solo. Cuando termines el ejercicio, guarda la sesion para que quede
          en tu historial.
        </p>
      </div>

      <RestTimerBar
        timer={timer}
        onAdjust={adjustTimer}
        onPauseToggle={pauseToggle}
        onDismiss={dismissTimer}
        accent={day.focus === "priority" ? COLORS.gold : COLORS.teal}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
